# MintPy for the ALOS-1 PALSAR stripmapStack stack (2007-2009 historical
# baseline). Rendered by p1_mintpy.sbatch: __STACK__, __META__, __UNW__ and
# __CONN__ are substituted with the actual paths/globs found on disk.
mintpy.load.processor       = isce
mintpy.load.metaFile        = __META__
mintpy.load.baselineDir     = __STACK__/baselines
mintpy.load.unwFile         = __UNW__
mintpy.load.corFile         = __STACK__/Igrams/*/filt_*.cor
mintpy.load.connCompFile    = __CONN__
mintpy.load.demFile         = __STACK__/geom_reference/hgt.rdr
mintpy.load.lookupYFile     = __STACK__/geom_reference/lat.rdr
mintpy.load.lookupXFile     = __STACK__/geom_reference/lon.rdr
mintpy.load.incAngleFile    = __STACK__/geom_reference/los.rdr
mintpy.load.azAngleFile     = __STACK__/geom_reference/los.rdr
mintpy.load.shadowMaskFile  = __STACK__/geom_reference/shadowMask.rdr
# network: keep every pair the stack made; drop only by coherence
mintpy.network.coherenceBased  = yes
mintpy.network.minCoherence    = 0.25
mintpy.network.keepMinSpanTree = yes
# reference: automatic, on a high-coherence pixel; the validation step
# re-references statistically to non-peat ground, so the exact point is
# not a claim in itself
mintpy.reference.minCoherence  = 0.85
# unwrapping errors: phase closure (Zahro et al. 2025 used bridging + closure)
mintpy.unwrapError.method      = phase_closure
mintpy.networkInversion.weightFunc = var
mintpy.networkInversion.minTempCoh = 0.6
mintpy.troposphericDelay.method = no
mintpy.topographicResidual      = yes
mintpy.deramp                   = linear
mintpy.velocity.startDate       = auto
mintpy.velocity.endDate         = auto
mintpy.geocode                  = yes
mintpy.geocode.laloStep         = 0.000833333, 0.000833333
mintpy.plot = no
