[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peatguard"
version = "0.2.0"
description = "NISAR L-band InSAR monitoring of drained tropical peatland: coherence, relative displacement, fire history and dam-site ranking"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tommy Quak", email = "7ommyquak@gmail.com"}]
readme = "README.md"

dependencies = [
    # Geospatial core
    "rasterio>=1.3.0",
    "rioxarray>=0.15.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "fiona>=1.9.0",
    "pyproj>=3.6.0",
    "xarray>=2024.1.0",

    # Scientific computing
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.1.0",
    "scikit-image>=0.22.0",
    "h5py>=3.10.0",

    # Data access
    "asf_search>=7.0.0",
    "earthaccess>=0.9.0",

    # Configuration and utilities
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",

    # Visualization
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
# CI uses this with the dashboard extra to exercise every offline test.
# MintPy/ISCE and live cloud credentials are not required by this suite.
ci = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",  # Starlette/FastAPI TestClient transport
    "build>=1.2.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
]
mintpy = [
    "mintpy @ git+https://github.com/insarlab/MintPy.git@53030ef4ae390ff17e845a342e086993eca81115",
]
jupyter = [
    "jupyterlab>=4.0.0",
    "notebook>=7.0.0",
]
dashboard = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "titiler.core>=0.18.0",
    "jinja2>=3.1.0",
]
# Optional Google Cloud Storage product sync (peatguard.export.gcs); the
# pipeline and dashboard run fully offline without it.
cloud = [
    "google-cloud-storage>=2.14.0",
    "google-cloud-run>=0.10.0",
]
# 3D flyover and fire-recurrence figure code under viz/
viz = [
    "pyvista>=0.43.0",
    "pillow>=10.0.0",
    "scikit-image>=0.22.0",
]

[project.scripts]
peatguard = "peatguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peatguard = ["data/*.yaml", "dashboard/templates/*.html"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
# cluster/full/tests holds the regression suite for the alosStack workflow
# defects (audit r6 finding 6). Excluding it meant a routine `pytest` run gave a
# green result while none of those fixes was protected.
testpaths = ["tests", "cluster/full/tests"]
addopts = "-v --tb=short"
