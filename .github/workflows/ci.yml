name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI never receives deployment credentials or a write-capable repository token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUNBUFFERED: '1'
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      # Official release tags resolved directly from their repositories.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[ci,dashboard]'
          python -m pip check
      - name: Validate Python and cluster shell syntax without executing jobs
        run: python scripts/ci/check_pipeline.py
      - name: Smoke installed package and diagnostic command interfaces
        run: python scripts/ci/smoke_installed_package.py
      - name: Record resolved test environment
        run: python -m pip freeze --all > "$RUNNER_TEMP/pipeline-environment.txt"
      - name: Run every configured test path, including cluster regressions
        run: python -m pytest --junitxml="$RUNNER_TEMP/pipeline-pytest.xml"
      - name: Replay committed golden offsets and synthetic crop-pack self-test
        env:
          CROP_PACK_NUMPY_FIT: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python cluster/full/tests/test_golden_replay.py
          python cluster/full/tests/selftest.py
      - name: Smoke the sample-data viewer
        env:
          PEATGUARD_WEBDATA_DIR: ${{ github.workspace }}/data/sample
        run: |
          python -m uvicorn peatguard.dashboard.app:app --host 127.0.0.1 --port 8080 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/products | python -c 'import json,sys; d=json.load(sys.stdin); print(len(d["products"]), "products")'
          curl -fsS -o /dev/null -w '%{http_code}\n' "http://127.0.0.1:8080/cog/tiles/WebMercatorQuad/10/837/519.png?url=$PEATGUARD_WEBDATA_DIR/nisar_coherence_80m.tif&rescale=0,1&colormap_name=viridis&nodata=-9999"
          kill %1
      - name: Preserve test evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-tests-py${{ matrix.python-version }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pipeline-pytest.xml
            ${{ runner.temp }}/pipeline-environment.txt
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Build and smoke the wheel
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build and smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[ci,dashboard]'
          python -m pip check
      - name: Build wheel and source distribution
        run: python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Install and smoke the newly built wheel
        run: |
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP/dist/"*.whl
          python -m pip check
          python scripts/ci/smoke_installed_package.py
      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peatguard-nisar-${{ github.sha }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 30
      # Deliberately no production, cloud, SSH, or scheduler deployment.
